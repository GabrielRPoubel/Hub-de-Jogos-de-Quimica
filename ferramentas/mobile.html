<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Visualizador mobile</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #4a4a4a;
        }

        iframe {
            width: 390px;
            height: 720px;
            border: 0;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <iframe id="quadro" src="about:blank" title="Pré-visualização mobile"></iframe>
    <script>
        const alvo = decodeURIComponent(location.hash.slice(1));
        if (alvo) {
            document.getElementById('quadro').src = alvo;
        }
    </script>
</body>
</html>
