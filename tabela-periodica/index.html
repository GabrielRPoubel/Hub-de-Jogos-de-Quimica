<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Periódica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../comum/estilos/base.css?v=9">
    <link rel="stylesheet" href="../comum/tabela-periodica/tabela-periodica.css?v=9">
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
    <a href="../index.html#jogos" class="back-link">← VOLTAR AO HUB</a>

    <h1 class="oculto-visual">Tabela Periódica</h1>

    <main>
        <div class="barra-tabela">
            <div class="modo-tabela" role="group" aria-label="Categoria de cores">
                <button class="modo-botao ativo" id="cat-familias" onclick="definirCategoria('familias')">Famílias</button>
                <button class="modo-botao" id="cat-eletronegatividade" onclick="definirCategoria('eletronegatividade')">Eletronegatividade</button>
                <button class="modo-botao" id="cat-raio" onclick="definirCategoria('raio')">Raio atômico</button>
                <button class="modo-botao" id="cat-ionizacao" onclick="definirCategoria('ionizacao')">Energia de ionização</button>
            </div>
            <div class="modo-tabela modo-tabela--sub" id="sub-familias" role="group" aria-label="Nível de detalhe das famílias">
                <button class="modo-botao ativo" id="modo-simples" onclick="definirModo('simples')">Simples</button>
                <button class="modo-botao" id="modo-completa" onclick="definirModo('completa')">Completa</button>
            </div>
            <button class="modo-botao modo-botao--original" id="botao-original" onclick="voltarOriginal()" title="Voltar à visualização original da tabela">
                <span class="icone" data-icone="reiniciar"></span>
                Original
            </button>
        </div>

        <div class="area-tabela">
            <div id="periodic-table"></div>
        </div>
    </main>

    <script src="../comum/icones/icones.js?v=9"></script>
    <script src="../comum/tabela-periodica/elements.js?v=9"></script>
    <script src="../comum/tabela-periodica/tabela-periodica.js?v=9"></script>
    <script>
        TabelaPeriodica.montar('#periodic-table', {
            modo: 'completa',
            legenda: 'espaco',
            detalhes: true,
            classificacao: 'simples',
            categoria: 'familias'
        });

        const BOTOES_CATEGORIA = {
            familias: 'cat-familias',
            eletronegatividade: 'cat-eletronegatividade',
            raio: 'cat-raio',
            ionizacao: 'cat-ionizacao'
        };

        let categoriaAtualPagina = 'familias';
        let classificacaoAtualPagina = 'simples';

        function atualizarBotoes() {
            Object.keys(BOTOES_CATEGORIA).forEach(chave => {
                const botao = document.getElementById(BOTOES_CATEGORIA[chave]);
                const ativo = chave === categoriaAtualPagina;
                botao.classList.toggle('ativo', ativo);
                botao.setAttribute('aria-pressed', String(ativo));
            });
            document.getElementById('sub-familias').hidden = categoriaAtualPagina !== 'familias';
            const simples = document.getElementById('modo-simples');
            const completa = document.getElementById('modo-completa');
            simples.classList.toggle('ativo', classificacaoAtualPagina === 'simples');
            simples.setAttribute('aria-pressed', String(classificacaoAtualPagina === 'simples'));
            completa.classList.toggle('ativo', classificacaoAtualPagina === 'completa');
            completa.setAttribute('aria-pressed', String(classificacaoAtualPagina === 'completa'));
        }

        atualizarBotoes();

        function definirModo(classificacao) {
            classificacaoAtualPagina = TabelaPeriodica.definirClassificacao(classificacao);
            atualizarBotoes();
        }

        function definirCategoria(categoria) {
            categoriaAtualPagina = TabelaPeriodica.definirCategoria(categoria);
            atualizarBotoes();
        }

        function voltarOriginal() {
            const estado = TabelaPeriodica.definirVisualizacao({ categoria: 'familias', classificacao: 'simples' });
            categoriaAtualPagina = estado.categoria;
            classificacaoAtualPagina = estado.classificacao;
            atualizarBotoes();
        }
    </script>
</body>
</html>
